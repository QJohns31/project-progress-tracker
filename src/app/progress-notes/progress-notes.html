<h2>Progress Notes</h2>

<form [formGroup]="progressForm">

  <!-- Project Code Field -->
  <div>
    <label for="project-code">Project Code:</label>
    <input
      id="project-code"
      type="text"
      formControlName="projectCode"
      placeholder="Enter Project Code"
      (blur)="onProjectCodeChange()"
      (change)="onProjectCodeChange()">

    <!-- Error Message -->
    @if (projectCodeError()) {
      <p style="color: red;">{{ projectCodeError() }}</p>
    }
  </div>

  <!-- Project Name Field -->
  <div>
    <label for="project-name">Project Name:</label>
    <input
      id="project-name"
      type="text"
      formControlName="projectName"
      readonly>
  </div>

  <!-- Date Field -->
  <div>
    <label for="date">Date:</label>
    <input
      id="date"
      type="date"
      formControlName="date">
  </div>

  <!-- Current Status Field -->
  <div>
    <label for="current-status">Current Status:</label>
    <select
      id="current-status"
      formControlName="currentStatus">
      <option value="">Select Status</option>
      <option value="On Track">On Track</option>
      <option value="Needs Attention">Needs Attention</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <!-- Team Member Field -->
  <div>
    <label for="team-member">Team Member:</label>
    <input
      id="team-member"
      type="text"
      formControlName="teamMember">
  </div>

  <!-- Progress Note Field -->
  <div>
    <label for="progress-note">Progress Note:</label>
    <textarea
      id="progress-note"
      rows="4"
      formControlName="progressNote"></textarea>
  </div>

</form>
